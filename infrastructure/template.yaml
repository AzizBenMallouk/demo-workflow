AWSTemplateFormatVersion: '2010-09-09'
Description: Multi-Environment EC2 Deployment with CI-safe signaling

# ---------------- PARAMETERS ----------------
Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [Dev, Prod]

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 KeyPair

  LatestAMIId:
    Type: AWS::EC2::Image::Id
    Default: ami-0fffffffffffffff # ignored in Dev, overridden in Prod

# ---------------- CONDITIONS ----------------
Conditions:
  IsProduction: !Equals [!Ref EnvironmentName, Prod]

# ---------------- RESOURCES ----------------
Resources:

  # ---------- NETWORK ----------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-VPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  # ---------- SECURITY ----------
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App SG
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: 0.0.0.0/0

  # ---------- EC2 ----------
  EC2Instance:
    Type: AWS::EC2::Instance

    # 🔥 CRITICAL FOR CI
    CreationPolicy:
      ResourceSignal:
        Timeout: PT15M

    Properties:
      ImageId: !If
        - IsProduction
        - !Ref LatestAMIId
        - !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2}}"

      InstanceType: !If [IsProduction, t3.medium, t2.micro]
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          yum update -y
          yum install -y aws-cfn-bootstrap git

          curl -fsSL https://rpm.nodesource.com/setup_18.x | bash -
          yum install -y nodejs

          mkdir -p /home/ec2-user/app
          cd /home/ec2-user/app

          git clone https://github.com/YOUR_GITHUB_USER/YOUR_REPO.git .

          npm install --production

          nohup node index.js > /var/log/app.log 2>&1 &

          # 🔥 SIGNAL CLOUDFORMATION (REQUIRED)
          /opt/aws/bin/cfn-signal \
            --exit-code $? \
            --stack ${AWS::StackName} \
            --resource EC2Instance \
            --region ${AWS::Region}

      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-App-Server

  # ---------- MONITORING (PROD ONLY) ----------
  HighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub ${EnvironmentName}-HighCPU
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref EC2Instance

# ---------------- OUTPUTS ----------------
Outputs:
  InstanceId:
    Value: !Ref EC2Instance

  InstancePublicIP:
    Value: !GetAtt EC2Instance.PublicIp
