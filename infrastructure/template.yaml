AWSTemplateFormatVersion: '2010-09-09'
Description: Multi-Environment EC2 Deployment Demo with Self-Contained VPC

# --- Parameters Section ---
Parameters:
  EnvironmentName:
    Type: String
    Description: Environment name (Dev or Prod)
    AllowedValues: [Dev, Prod]
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 KeyPair to enable SSH access. # Required!
  LatestAMIId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2 # Base AMI for Dev

# --- Conditions Section ---
Conditions:
  IsProduction: !Equals [!Ref EnvironmentName, "Prod"]
  EnableMonitoring: !If [IsProduction, "true", "false"]

# --- Resources Section ---
Resources:
  # --- 1. Networking (New VPC for the stack) ---
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: 'true'
      EnableDnsHostnames: 'true'
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-VPC
          
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Tags:
      - Key: Name
        Value: !Sub ${EnvironmentName}-IGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: 'true'
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-PublicSubnet

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-RouteTable

  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  # --- 2. Security Group ---
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub Security group for ${EnvironmentName} app
      VpcId: !Ref VPC # References new VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '22'
          ToPort: '22'
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: '3000'
          ToPort: '3000'
          CidrIp: 0.0.0.0/0

  # --- 3. EC2 Instance ---
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAMIId # Uses base AMI for Dev, or the AMI ID passed by Prod
      InstanceType: !If [IsProduction, t3.medium, t2.micro] # Conditional Instance Type
      KeyName: !Ref KeyName # MANDATORY to replace
      NetworkInterfaces:
        - AssociatePublicIpAddress: 'true'
          DeviceIndex: '0'
          SubnetId: !Ref PublicSubnet # References new Subnet
          GroupSet:
            - !Ref InstanceSecurityGroup
      # Example UserData to install Node.js and run the app (Requires app/index.js in repo)
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          curl -fsSL https://rpm.nodesource.com/setup_18.x | bash -
          yum install -y nodejs git
          git clone https://github.com/YOUR_GITHUB_USER/YOUR_REPO.git /home/ec2-user/app # IMPORTANT: CHANGE THIS
          chown -R ec2-user:ec2-user /home/ec2-user/app
          cd /home/ec2-user/app
          npm install
          nohup node index.js > /var/log/app.log 2>&1 &
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-App-Server

  # --- 4. CloudWatch Alarm (Conditional Monitoring) ---
  HighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      AlarmName: !Sub ${EnvironmentName}-High-CPU-Alarm
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 2
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Period: 300
      Statistic: Average
      Threshold: '80'
      ActionsEnabled: 'true'
      AlarmActions:
        - arn:aws:sns:REGION:ACCOUNT_ID:AlarmTopic # IMPORTANT: CHANGE THIS
      Dimensions:
        - Name: InstanceId
          Value: !Ref EC2Instance

# --- Outputs Section ---
Outputs:
  InstanceId:
    Description: The ID of the EC2 Instance
    Value: !Ref EC2Instance
    Export:
      Name: !Sub ${EnvironmentName}AppInstanceId
  InstancePublicIP:
    Description: Public IP address of the EC2 Instance
    Value: !GetAtt EC2Instance.PublicIp
    Export:
      Name: !Sub ${EnvironmentName}AppPublicIP